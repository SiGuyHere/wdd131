<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive gallery of cool pictures.">
  <title>📷 Cool Pics</title>
  <link rel="stylesheet" href="coolpics.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">📷 Cool Pics</a>
    <button class="menu-button" type="button" aria-label="Open menu">Menu</button>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="home">
    <section class="intro" aria-labelledby="page-heading">
      <h1 id="page-heading">Cool Pics</h1>
      <p>A collection of pictures worth a closer look.</p>
    </section>

    <section class="gallery" id="gallery" aria-label="Photo gallery">
      <figure>
        <img src="images/book-full.jpg" alt="A book resting on a desk" loading="lazy">
      </figure>
      <figure>
        <img src="images/couch-full.jpg" alt="A comfortable couch in a bright room" loading="lazy">
      </figure>
      <figure>
        <img src="images/desk-full.jpg" alt="A tidy workspace with a desk" loading="lazy">
      </figure>
      <figure>
        <img src="images/keyboard-full.jpg" alt="A close-up view of a computer keyboard" loading="lazy">
      </figure>
      <figure>
        <img src="images/phone-full.jpg" alt="A phone on a desk" loading="lazy">
      </figure>
      <figure>
        <img src="images/sit-full.jpg" alt="Someone sitting and relaxing" loading="lazy">
      </figure>
    </section>

    <section class="about" id="about">
      <h2>See something cool</h2>
      <p>Explore the gallery and enjoy a few simple moments captured in pictures.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cool Pics</p>
  </footer>
</body>
</html>
